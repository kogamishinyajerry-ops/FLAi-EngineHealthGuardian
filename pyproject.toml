[project]
name = "ehm"
version = "0.0.1"
description = "FLAi Engine Health Guardian — COMAC EHM intelligent agent (scaffold v0)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "COMAC FLAi Team" }]
dependencies = [
    "pydantic>=2.7",
    "polars>=1.0",
    "duckdb>=1.0",
    "rdflib>=7.0",
    "langgraph>=0.2",
    "opentelemetry-api>=1.25",
    "opentelemetry-sdk>=1.25",
]

[dependency-groups]
dev = [
    "ruff>=0.5",
    "mypy>=1.10",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pre-commit>=3.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ehm"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scenarios", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N", "D"]
ignore = ["D100", "D104", "D105", "D107"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D", "S101"]
"scenarios/*" = ["D"]
"scripts/*" = ["D"]
"src/ehm/dashboard/style.py" = ["E501"]  # CSS one-liners are legitimately long
"src/ehm/dashboard/render.py" = ["E501"]  # HTML markup generation; breaking hurts readability
"src/ehm/dashboard/charts.py" = ["E501"]  # SVG path math is long

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["ehm"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["rdflib.*", "langgraph.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.coverage.run]
source = ["ehm"]
